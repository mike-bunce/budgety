<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive Files</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    section { margin-bottom: 2rem; }
    button { padding: .4rem .9rem; cursor: pointer; }
    pre { background: #f3f3f3; padding: .75rem; overflow-x: auto; border-radius: 4px; }
    #status { color: #555; min-height: 1.5em; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1b1b; color: #eee; }
      pre { background: #2a2a2a; }
      #status { color: #aaa; }
    }
  </style>
</head>
<body>
  <h1>Drive Files</h1>
  <p id="status"></p>

  <section>
    <h2>Files</h2>
    <button id="refresh">Refresh list</button>
    <pre id="list">Loading…</pre>
  </section>

  <section>
    <h2>Upload</h2>
    <input type="file" id="file">
    <button id="upload">Upload</button>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
